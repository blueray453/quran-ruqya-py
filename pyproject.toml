[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ruqya-quran"
dynamic = ["version"]
description = "Quranic Ruqya player (PySide6 GUI)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Ismail"}]
keywords = ["islam", "quran", "ruqya", "recitation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Topic :: Religion",
]
dependencies = [
    "PySide6>=6.6.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = ["build", "ruff"]

[project.scripts]
ruqya-quran = "ruqya_quran.main:main"

[tool.setuptools.dynamic]
version = {attr = "ruqya_quran.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ruqya_quran = ["Main.qml", "config.json"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]