# sources.lock.yaml — pinned read-only source layer.
#
# Rules:
#   - Files listed here are NEVER modified and NEVER copied into annotations/.
#   - build.py joins them at read time; annotations reference them by word number only.
#   - qa.py verifies every sha256 below before running any other check.
#   - A source may be ADDED (new family) or its file RE-VERIFIED, but never silently replaced.
lock_version: 1
project: quran-annotations
frozen_on: 2026-11-14

