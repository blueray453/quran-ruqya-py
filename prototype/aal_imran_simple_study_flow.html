const SND={191:'Starts long and builds. {قِيَامًا وَقُعُودًا} are a matched pair: long vowel in the middle, -an at the end. Then the heavy {رَبَّنَا}.',192:'Short and clipped. {أَخْزَيْتَهُ} lands on ـتَ + ـهُ. Ends -ār, like 191.',193:'The sound of “we”: ـنا / ـنَّ returns again and again. {مُنَادِيًا يُنَادِي}: same root side by side.',194:'{رَبَّنَا}, then ـنا on {وَآتِنَا} {وَعَدتَّنَا} {تُخْزِنَا}. The ending shifts from -ār to -ād: {الْمِيعَادَ}.',195:'The longest ayah. A run of ـُوا verbs builds up, then two heavy promises: {لَأُكَفِّرَنَّ} … {وَلَأُدْخِلَنَّهُمْ}, each starting لَأُ and ending ـنَّ. Ends on {الثَّوَابِ}, echoing {ثَوَابًا}.',196:'One short breath. {يَغُرَّنَّكَ} is heavy: doubled ر and doubled ن. Ends -ād.',197:'Short. {مَتَاعٌ قَلِيلٌ}: two -un words. {ثُمَّ} and {جَهَنَّمُ} share the closed -mm sound.',198:'Mirrors the garden line of 195 word for word. Ends back on -ār with {لِلْأَبْرَارِ}, echoing 193.',199:'Closes on -āb ({الْحِسَابِ}) like 195. {ثَمَنًا قَلِيلًا}: two -an words. {أُنزِلَ} twice.',200:'Four commands, all ending ـُوا. Then {لَعَلَّكُمْ تُفْلِحُونَ}: the only ayah here ending in -ūn.'};
const INS={
191:[['The doer hides inside the verb','{يَذْكُرُونَ} already means “they remember”: the ـونَ is the doer. There is no separate word “they”. Same in {وَيَتَفَكَّرُونَ}.',[[1,1],[7,7]]],['فِي changes the next word','{فِي} rules what follows: {خَلْقِ} ends in kasra because of it. The owner {السَّمَاوَاتِ} comes after: “creation-of the heavens”.',[[8,11]]],['A call, then a claim','{رَبَّنَا} calls out first. {مَا خَلَقْتَ} = “You did not create”: مَا negates, ـتَ is “You”.',[[12,16]]]],
192:[['Whoever … then','{مَن تُدْخِلِ النَّارَ} “whoever You admit to the Fire”, then {فَقَدْ أَخْزَيْتَهُ} “then You have disgraced him”. فَ opens the result.',[[2,6]]],['No verb “have”','{وَمَا لِلظَّالِمِينَ مِنْ أَنصَارٍ}: “not for the wrongdoers any helpers”. لِـ says who it is for; مِنْ adds “any”.',[[7,10]]]],
193:[['“We” everywhere','The ending ـنا returns eight times. Same two letters: we, our, us.','sfx:nA'],['Same root, side by side','{مُنَادِيًا يُنَادِي}: a caller, calling. Root ن د ي in two shapes.',[[3,4]]]],
194:[['A plea and a statement','{وَلَا تُخْزِنَا} (do not disgrace us) is a plea. {لَا تُخْلِفُ} (You never break) is a statement. Same لَا, different job.',[[6,7],[11,12]]],['What You promised','{وَعَدتَّنَا}: ـتَ = You, ـنَا = us. {الْمِيعَادَ} comes from the same root وعد.',[[2,3],[13,13]]]],
195:[['God now speaks: “I”','{أَنِّي} {أُضِيعُ} {لَأُكَفِّرَنَّ} {وَلَأُدْخِلَنَّهُمْ} {سَبِيلِي}: every “I / my” is God. In 193 it was “we”.',[[3,5],[23,23],[26,26],[29,29]]],['The promise frame','لَ (surely) + أُ (I) + verb + ـنَّ (emphasis). {وَلَأُدْخِلَنَّهُمْ} adds ـهُمْ (them) at the very end.',[[26,26],[29,29]]],['Long “those who…” first','Five ـوا verbs describe the group first. The main verb comes only after, and {عَنْهُمْ} points back to the group.',[[16,28]]],['Done to them','{وَأُخْرِجُوا} {وَأُوذُوا} {وَقُتِلُوا}: u … i vowels = passive. {وَقَاتَلُوا} is active: they fought.',[[18,18],[21,21],[24,25]]]],
196:[['Verb before doer','{لَا يَغُرَّنَّكَ تَقَلُّبُ}: “let not deceive-you the moving about”. ـكَ = you, ـنَّ = emphasis.',[[0,2]]]],
197:[['Noun, then its describer','{مَتَاعٌ قَلِيلٌ}: the describing word follows and copies the ending (-un, -un).',[[0,1]]],['Two nouns, no “is”','{مَأْوَاهُمْ جَهَنَّمُ}: “their refuge — Hell”. Arabic needs no word for “is”.',[[3,4]]]],
198:[['The same line as 195','{تَجْرِي مِن تَحْتِهَا الْأَنْهَارُ} repeats. {تَجْرِي} is “she flows”: rivers (a plural of things) count as feminine singular.',[[6,9]]],['“Have” is لِـ','{لَهُمْ جَنَّاتٌ}: “for them, gardens”.',[[4,5]]]],
199:[['“Among”','{وَإِنَّ مِنْ أَهْلِ الْكِتَابِ لَمَن …}: the place “among” comes first, then “some who” (لَمَن).',[[0,5]]],['Believing in two things','{بِاللَّهِ وَمَا أُنزِلَ إِلَيْكُمْ وَمَا أُنزِلَ إِلَيْهِمْ}: وَمَا adds each thing. {أُنزِلَ} is passive: “was sent down”.',[[6,12]]]],
200:[['Four commands in a row','Each ends in ـُوا (you all). {صَابِرُوا} and {رَابِطُوا} share the same long-ā shape.',[[4,7]]],['So that you…','{لَعَلَّكُمْ تُفْلِحُونَ}: لَعَلَّ + ـكُمْ (you all), then the result verb: you succeed.',[[9,10]]]]};
const CONC={
nA:{t:'{ـنا}',h:'we · our · us',d:'The “us” slot. The host word decides the job. On a noun: our ({رَبَّنَا}, {ذُنُوبَنَا}). On a past verb: we did it ({سَمِعْنَا}, {فَآمَنَّا}). On a command or present verb: it happens to us ({فَقِنَا}, {وَآتِنَا}, {تُخْزِنَا}). After a preposition: us ({لَنَا}, {عَنَّا}).'},
y:{t:'{ـي}',h:'I · my',d:'The “me” slot. On a noun: my ({سَبِيلِي}). After إِنَّ-type particles: the I the particle looks at ({أَنِّي}). In 195 God speaks, so the passage shifts from “we / you” to “I”.'},
hm:{t:'{ـهم}',h:'they · them · their',d:'The “they” slot. On a noun: their ({رَبُّهُمْ}, {دِيَارِهِمْ}). After a preposition: to / from them ({لَهُمْ}, {عَنْهُمْ}). On a verb: them ({وَلَأُدْخِلَنَّهُمْ}). The vowel follows what is before it: ـهُمْ after a or u, ـهِمْ after i or y ({جُنُوبِهِمْ}, {رَبِّهِمْ}).'},
km:{t:'{ـكم}',h:'you all · your',d:'The “you all” slot. The three plurals line up: ـنا we, ـهم they, ـكم you all. On a noun: {بِرَبِّكُمْ}, {بَعْضُكُم}. After a preposition: {مِنكُم}, {إِلَيْكُمْ}. After لَعَلَّ: {لَعَلَّكُمْ}.'},
k:{t:'{ـك}',h:'you · your (one person)',d:'The “you (one)” slot. Speaking to God: {إِنَّكَ}, {سُبْحَانَكَ}, {رُسُلِكَ}. In 196 it is the listener: {يَغُرَّنَّكَ}, where ـكَ is who gets deceived.'},
h:{t:'{ـه / ـها}',h:'him · his · her · it',d:'“He / it” is ـهُ and “she / it” is ـها. {أَخْزَيْتَهُ}: you disgraced him. {عِندَهُ}: with Him. {تَحْتِهَا}, {فِيهَا}: ـها points back to {جَنَّاتٍ}; a plural of things counts as “she”.'},
wA:{t:'{ـوا / ـون}',h:'a group doing it',d:'A verb can carry a group doer inside it. Past and command: ـوا ({هَاجَرُوا}, {اصْبِرُوا}). Present: ـون ({يَذْكُرُونَ}, {تُفْلِحُونَ}). In the past it is “they”; in the commands of 200 it is “you all”.'},
fi:{t:'{فِي}',h:'in',d:'فِي rules the next word: it must end in kasra (genitive). {فِي خَلْقِ}: the ق takes ـِ. Same with {فِي الْبِلَادِ}, {فِي سَبِيلِي}. With a pronoun it glues on: {فِيهَا}.'},
li:{t:'{لِـ}',h:'for · to · owning',d:'لِـ glues onto the next word and marks who it is for. Before a noun the noun ends in kasra: {لِلظَّالِمِينَ}, {لِلْإِيمَانِ}, {لِلَّهِ}. Before a pronoun it becomes لَـ: {لَهُمْ}, {لَنَا}. Arabic “has” is often just لِـ: {لَهُمْ جَنَّاتٌ} = for them, gardens.'},
min:{t:'{مِن}',h:'from · of · any',d:'مِن + noun: from / some of / any. The noun ends in kasra: {مِن ذَكَرٍ}, {مِنْ أَنصَارٍ}. Glued to a pronoun: {مِنكُم}. In {وَمَا لِلظَّالِمِينَ مِنْ أَنصَارٍ}, مِنْ adds “not any”.'},
pr:{t:'{عَلَىٰ · مَعَ · بِـ · عَنْ · إِلَىٰ}',h:'other prepositions',d:'They work like فِي: the next noun ends in kasra. {عَلَىٰ رُسُلِكَ}, {مَعَ الْأَبْرَارِ}, {بِاللَّهِ}. With pronouns they glue on, sometimes reshaping: {عَنْهُمْ}, {عَنَّا}, {إِلَيْكُمْ} (إِلَىٰ becomes إِلَيْـ).'},
case:{t:'Endings by role',h:'which vowel, which role',d:'English shows roles by position. Arabic shows them by the last vowel. -u / -un: the doer or the topic. -a / -an: the receiver, the “how”, or the noun after إِنَّ. -i / -in: after a preposition or as the owner. One word, three roles: {اللَّهُ} (the topic), {اللَّهَ} (they remember God), {اللَّهِ} (with God).'},
past:{t:'Past verbs',h:'who did it',d:'The doer is inside the end of a past verb: ـتَ you ({خَلَقْتَ}), ـنَا we ({سَمِعْنَا}), ـوا they ({هَاجَرُوا}), nothing = he ({فَاسْتَجَابَ}).'},
pres:{t:'Present verbs',h:'who does it',d:'A present verb starts with a doer-prefix: يـ he / they ({يَذْكُرُونَ}), تـ you or she / it ({تُدْخِلِ}, {تَجْرِي}), أ I ({أُضِيعُ}). {تَجْرِي} is “she / it flows” because its doer {الْأَنْهَارُ} is a plural of things.'},
pass:{t:'Passive',h:'done to them',d:'The doer disappears and the vowels become u … i: {وَأُخْرِجُوا}, {وَأُوذُوا}, {وَقُتِلُوا}, {أُنزِلَ}. Compare active {وَقَاتَلُوا} with passive {وَقُتِلُوا}.'},
imp:{t:'Commands',h:'orders and pleas',d:'A command is the bare stem, with no يـ / تـ prefix. In du‘a it takes ـنا: {فَقِنَا}, {وَآتِنَا}, {وَتَوَفَّنَا}; or stands alone: {فَاغْفِرْ}, {وَكَفِّرْ}. To a group it ends in ـُوا: {آمِنُوا}, {اصْبِرُوا}, {وَاتَّقُوا}.'},
la:{t:'{لَا / مَا}',h:'not · do not',d:'لَا before a present verb has two jobs. A plea or warning: {وَلَا تُخْزِنَا}, {لَا يَغُرَّنَّكَ}. A flat statement: {لَا أُضِيعُ}, {لَا تُخْلِفُ}. مَا negates too: {مَا خَلَقْتَ}, {وَمَا لِلظَّالِمِينَ}.'},
emph:{t:'{لَـ … ـنَّ}',h:'surely',d:'A heavy -nna on a verb makes it emphatic: {لَا يَغُرَّنَّكَ}. With لَـ in front it is a promise: {لَأُكَفِّرَنَّ}, {وَلَأُدْخِلَنَّهُمْ} = “I will surely…”. Frame: لَـ + أُ (I) + stem + ـنَّ, then any glued pronoun.'},
voc:{t:'{رَبَّنَا} · {يَا أَيُّهَا}',h:'calling out',d:'{رَبَّنَا} = {رَبَّ} (Lord) + {نَا} (our), said as a call, with fatha. It opens five requests (191–194); what follows changes each time. {يَا أَيُّهَا} in 200 is a call to the believers.'},
inna:{t:'{إِنَّ}',h:'indeed + pronoun',d:'إِنَّ means “indeed” and wants a noun or pronoun right after it, so a pronoun is glued on: {إِنَّكَ}, {إِنَّنَا}, {أَنِّي}, {لَعَلَّكُمْ}. If a full noun follows, it takes fatha: {إِنَّ اللَّهَ}.'},
fa:{t:'{فَـ}',h:'so · then',d:'فَـ means what follows is a result or reaction. {فَقِنَا}: so protect us. {فَاسْتَجَابَ}: so He answered. {فَالَّذِينَ}: so those who…'},
rel:{t:'{الَّذِينَ}',h:'those who',d:'A clause follows and says who they are; the verb ending points back at the group: {الَّذِينَ يَذْكُرُونَ}, {الَّذِينَ كَفَرُوا}, {الَّذِينَ اتَّقَوْا}.'},
al:{t:'{الـ}',h:'the',d:'الـ makes a noun specific. Before sun letters the ل is silent and the next letter doubles: {النَّارِ}, {الثَّوَابِ}. Before the others you hear it: {الْأَرْضِ}, {الْأَنْهَارُ}.'},
ptc:{t:'Doer nouns',h:'the one who does it',d:'A doer-noun names the one who does the action: {الظَّالِمِينَ} wrongdoers, {خَالِدِينَ} remaining, {خَاشِعِينَ} humble, {مُنَادِيًا} a caller, {عَامِلٍ} a worker.'}};

h+='<div class="sec">2 · Words <span class="mu">(tap one to open it)</span></div>'+wordsHTML(a);
h+=insightsHTML(a);
h+='<div class="sec">3 · Memorize</div><button data-act="mem" class="'+(st.mem?'on':'')+'">'+(st.mem?'Hide memorize tools':'Open memorize tools')+'</button>';
if(st.mem)h+=memHTML(a);
return h}
function render(){let h='';
if(st.za===null){h+='<div class="mu" style="margin-bottom:4px">Tap an ayah number to study it.</div>'+shapeHTML()+'<div class="row"><button data-act="mean" class="'+(st.mean?'on':'')+'">Show meaning</button></div>'+passageHTML(false)}
else{h+=focusHTML(st.za)+'<div class="sec">Where this shows up in the whole passage</div>'+passageHTML(true)}
M.innerHTML=h;document.getElementById('thb').textContent=st.light?'Dark':'Light';Q.classList.toggle('light',st.light)}
function renderCk(){let h='<div class="mu" style="margin-bottom:4px">Checked = keep explaining. Uncheck what you already know and its explanation disappears everywhere.</div>';
GROUPS.forEach(g=>{h+='<h4>'+g[0]+'</h4>'+g[1].map(c=>'<label><input type="checkbox" data-c="'+c+'" '+(st.chk[c]!==false?'checked':'')+'> '+A(CONC[c].t)+' <span class="mu">'+CONC[c].h+'</span></label>').join('')});
h+='<label style="margin-top:8px"><input type="checkbox" id="all" '+(st.all?'checked':'')+'> Show known explanations too</label>';CK.innerHTML=h}
Q.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t)return;const d=t.dataset,a=d.act;
if(a==='pat'){ensureP(d.v);st.pat=st.pat===d.v?null:d.v;st.rg=null;st.sel=null}
else if(a==='word'){const x=+d.a,i=+d.i;st.sel=st.sel&&st.sel.a===x&&st.sel.i===i?null:{a:x,i:i};st.za=x;st.pat=null;st.rg=null}
else if(a==='ay'){const n=+d.a;if(st.za!==n)st.rev={};st.za=n;st.sel=null;st.pat=null;st.rg=null}
else if(a==='home'){st.za=null;st.sel=null;st.pat=null;st.rg=null}
else if(a==='rg'){const r=JSON.parse(d.r);st.rg=st.rg&&JSON.stringify(st.rg)===d.r?null:r;st.pat=null;st.sel=null}
else if(a==='mem')st.mem=!st.mem;
else if(a==='mean')st.mean=!st.mean;
else if(a==='hide'){st.hide=+d.v;st.rev={}}
else if(a==='hint')st.hint=!st.hint;
else if(a==='rev'){st.rev[d.k]=!st.rev[d.k]}
else if(a==='und'){st.chk[d.c]=false;save();renderCk()}
else if(a==='exp'){st.chk[d.c]=true;save();renderCk()}
else if(a==='theme')st.light=!st.light;
else if(a==='ckb'){st.ck=!st.ck;CK.hidden=!st.ck;renderCk();return}
render()});
CK.addEventListener('change',e=>{const i=e.target;if(i.id==='all')st.all=i.checked;else{st.chk[i.dataset.c]=i.checked;save()}render()});
render();renderCk();
})();
</script></div></body></html>
