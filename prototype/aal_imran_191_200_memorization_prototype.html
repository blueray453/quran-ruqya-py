const SND={191:'Starts long and builds. {قِيَامًا وَقُعُودًا} are a matched pair: long vowel in the middle, -an at the end. Then the du‘a opens with the heavy {رَبَّنَا}.',192:'Short and clipped. {أَخْزَيْتَهُ} lands on the ـتَ + ـهُ sound. Closes on the same -ār as 191.',193:'The sound of “we”: ـنا / ـنَّ returns again and again ({إِنَّنَا} {سَمِعْنَا} {فَآمَنَّا} {لَنَا} {ذُنُوبَنَا} {عَنَّا} {سَيِّئَاتِنَا} {وَتَوَفَّنَا}). {مُنَادِيًا يُنَادِي}: same root side by side.',194:'{رَبَّنَا} again, then ـنا on {وَآتِنَا} {وَعَدتَّنَا} {تُخْزِنَا}. The ending shifts from -ār to -ād: {الْمِيعَادَ}.',195:'The longest ayah. A run of ـُوا verbs ({هَاجَرُوا} {وَأُخْرِجُوا} {وَأُوذُوا} {وَقَاتَلُوا} {وَقُتِلُوا}) builds up, then the two heavy promises {لَأُكَفِّرَنَّ} … {وَلَأُدْخِلَنَّهُمْ}: starts with لَأُ, ends with ـنَّ. Ends on {الثَّوَابِ}, the root of {ثَوَابًا} just before.',196:'One short breath. {يَغُرَّنَّكَ} is heavy: a doubled ر and a doubled ن. Ends -ād.',197:'Short. {مَتَاعٌ قَلِيلٌ}: two -un words. {ثُمَّ} and {جَهَنَّمُ} share the closed -mm sound.',198:'Mirrors 195’s garden line: {تَجْرِي مِن تَحْتِهَا الْأَنْهَارُ}, word for word. The ending returns to -ār with {لِلْأَبْرَارِ}, echoing 193.',199:'Closes on -āb ({الْحِسَابِ}), like 195. {ثَمَنًا قَلِيلًا}: two -an words. {أُنزِلَ} twice.',200:'Four commands in a row, all ending ـُوا. Then {لَعَلَّكُمْ تُفْلِحُونَ}: the only ayah here that ends in -ūn.'};
const AYO={191:[[[0,2],'{الَّذِينَ} starts the sentence; the verb {يَذْكُرُونَ} comes before its object {اللَّهَ}. “They” is already inside ـونَ.'],[[8,11],'{فِي} + {خَلْقِ} + owner: the possessed word first, its owner after.'],[[12,16],'{رَبَّنَا} first (the call), then the verb {خَلَقْتَ} before its object {هَٰذَا}.']],192:[[[1,4],'{إِنَّكَ} first, then {مَن} + verb {تُدْخِلِ} + object {النَّارَ}.'],[[7,10],'“For the wrongdoers” comes before what they lack: {لِلظَّالِمِينَ مِنْ أَنصَارٍ}.']],193:[[[2,5],'Verb {سَمِعْنَا}, object {مُنَادِيًا}, then the description {يُنَادِي}: what it describes comes first.'],[[10,13],'{رَبَّنَا} + {فَاغْفِرْ} (command first) + {لَنَا} (for whom) + {ذُنُوبَنَا} (what).']],194:[[[1,5],'Command {وَآتِنَا}, then {مَا} (what), then the verb {وَعَدتَّنَا}, then {عَلَىٰ رُسُلِكَ}: the clause attached to مَا follows it.'],[[10,13],'{إِنَّكَ} + {لَا} + verb + object.']],195:[[[1,2],'{لَهُمْ} comes before {رَبُّهُمْ}: “to them” first, the doer after.'],[[39,42],'{عِندَهُ} is placed before {حُسْنُ الثَّوَابِ}: the thing owned arrives last.']],196:[[[0,4],'Verb first: {لَا يَغُرَّنَّكَ}, then its doer {تَقَلُّبُ}. The doer is not “the subject at the front”.']],197:[[[0,1],'Noun first, describing word after: {مَتَاعٌ قَلِيلٌ}.'],[[2,4],'{مَأْوَاهُمْ جَهَنَّمُ}: two nouns side by side, no verb “is”.']],198:[[[4,5],'{لَهُمْ جَنَّاتٌ}: owners first, what they own after. No verb “have”.'],[[16,20],'{وَمَا عِندَ اللَّهِ خَيْرٌ}: the topic first, the comment {خَيْرٌ} last.']],199:[[[5,12],'{يُؤْمِنُ} + {بِاللَّهِ} + {وَمَا أُنزِلَ …}: each thing believed in follows the verb, joined by وَ.'],[[22,23],'{لَهُمْ أَجْرُهُمْ}: owners first, “their reward” last.']],200:[[[0,3],'The call comes first: {يَا أَيُّهَا الَّذِينَ آمَنُوا}.'],[[4,8],'Four commands, each verb first; the object {اللَّهَ} only after the fourth.']]};

{t:'Possessed first, owner after',r:[[191,8,11],[195,41,42],[199,28,29]],p:[['فِي','in'],['خَلْقِ','creation (of)'],['السَّمَاوَاتِ وَالْأَرْضِ','the heavens and the earth']],en:[1,2,3],n:'The order matches English, but the small words are gone: no “the” on {خَلْقِ} and no “of”. The kasra and the owner after it do that work. Same in {حُسْنُ الثَّوَابِ}, {سَرِيعُ الْحِسَابِ}.'},

{t:'The “how” after the object',r:[[191,1,6]],p:[['يَذْكُرُونَ','they remember'],['اللَّهَ','God'],['قِيَامًا وَقُعُودًا وَعَلَىٰ جُنُوبِهِمْ','standing, sitting, and on their sides']],en:[1,2,3],n:'“They” is not a word: it is the ـونَ inside the verb. The “how” ({قِيَامًا} …) sits at the end, in -an.'}];
const CONC={
nA:{t:'{ـنا}',h:'we · our · us',d:'The “us” slot. The host word decides the job. On a noun: our ({رَبَّنَا}, {ذُنُوبَنَا}, {سَيِّئَاتِنَا}). On a past verb: we did it ({سَمِعْنَا}, {فَآمَنَّا}). On a command or present verb: it happens to us ({فَقِنَا}, {وَآتِنَا}, {تُخْزِنَا}). After a preposition: us ({لَنَا}, {عَنَّا}). Same two letters every time.'},
y:{t:'{ـي}',h:'I · my',d:'The “me” slot. On a noun: my ({سَبِيلِي}). After إِنَّ-type particles: the I the particle looks at ({أَنِّي}). In 195 God speaks, so the passage shifts from “we / you” to “I”.'},
hm:{t:'{ـهم}',h:'they · them · their',d:'The “they” slot. On a noun: their ({رَبُّهُمْ}, {دِيَارِهِمْ}). After a preposition: to / from them ({لَهُمْ}, {عَنْهُمْ}, {إِلَيْهِمْ}). On a verb: them ({وَلَأُدْخِلَنَّهُمْ}). The vowel follows what is before it: ـهُمْ after a or u ({لَهُمْ}, {رَبُّهُمْ}), ـهِمْ after i or y ({جُنُوبِهِمْ}, {رَبِّهِمْ}, {إِلَيْهِمْ}).'},
km:{t:'{ـكم}',h:'you all · your',d:'The “you all” slot. The three plurals line up: ـنا we, ـهم they, ـكم you all. On a noun: {بِرَبِّكُمْ}, {بَعْضُكُم}. After a preposition: {مِنكُم}, {إِلَيْكُمْ}. After لَعَلَّ: {لَعَلَّكُمْ}.'},
k:{t:'{ـك}',h:'you · your (one person)',d:'The “you (one)” slot. Speaking to God: {إِنَّكَ}, {سُبْحَانَكَ}, {رُسُلِكَ}. In 196 it is a different you, the listener: {يَغُرَّنَّكَ}, where ـكَ is who gets deceived.'},
h:{t:'{ـه / ـها}',h:'him · his · her · it',d:'“He / it” is ـهُ and “she / it” is ـها. {أَخْزَيْتَهُ}: you disgraced him (object). {عِندَهُ}: with Him. {تَحْتِهَا}, {فِيهَا}: ـها points back to {جَنَّاتٍ}; a plural of things counts as “she”.'},
wA:{t:'{ـوا / ـون}',h:'a group doing it',d:'A verb can carry a group doer inside it. Past and command: ـوا ({هَاجَرُوا}, {قَاتَلُوا}, {اصْبِرُوا}). Present: ـون ({يَذْكُرُونَ}, {تُفْلِحُونَ}). In the past it is “they”; in the commands of 200 it is “you all”. No separate word for the doer is needed.'},
fi:{t:'{فِي}',h:'in',d:'فِي rules the next word: the next word must end in kasra (genitive). {فِي خَلْقِ}: the last letter ق takes ـِ. Same with {فِي الْبِلَادِ}, {فِي سَبِيلِي}. With a pronoun it glues on: {فِيهَا}.'},
li:{t:'{لِـ}',h:'for · to · owning',d:'لِـ glues onto the next word and marks the beneficiary or owner. Before a noun it stays لِ and the noun ends in kasra: {لِلظَّالِمِينَ}, {لِلْإِيمَانِ}, {لِلَّهِ}, {لِّلْأَبْرَارِ}. Before a pronoun it becomes لَـ: {لَهُمْ}, {لَنَا}. Arabic “has” is often just لِـ: {لَهُمْ جَنَّاتٌ} = for them, gardens.'},
min:{t:'{مِن}',h:'from · of · any',d:'مِن + noun: from / some of / any. The noun ends in kasra: {مِن ذَكَرٍ}, {مِنْ أَنصَارٍ}, {مِن بَعْضٍ}. Glued to a pronoun: {مِنكُم}. In {وَمَا لِلظَّالِمِينَ مِنْ أَنصَارٍ}, مِنْ adds “not any”.'},
pr:{t:'{عَلَىٰ · مَعَ · بِـ · عَنْ · إِلَىٰ}',h:'other prepositions',d:'They work like فِي: the next noun ends in kasra. {عَلَىٰ رُسُلِكَ}, {مَعَ الْأَبْرَارِ}, {بِاللَّهِ}, {بِآيَاتِ}. With pronouns they glue on, sometimes reshaping: {عَنْهُمْ}, {عَنَّا}, {إِلَيْكُمْ}, {إِلَيْهِمْ} (إِلَىٰ becomes إِلَيْـ).'},
case:{t:'Endings by role',h:'which vowel, which role',d:'English shows roles by position. Arabic shows them by the last vowel. -u / -un: the doer or the topic. -a / -an: the receiver, the “how”, or the noun after إِنَّ. -i / -in: after a preposition or as the owner. One word, three roles: {اللَّهُ} (195: God is the topic), {اللَّهَ} (191: they remember God), {اللَّهِ} (195: with God).'},
past:{t:'Past verbs',h:'who did it',d:'The doer is inside the end of a past verb: ـتَ you ({خَلَقْتَ}, {أَخْزَيْتَهُ}, {وَعَدتَّنَا}), ـنَا we ({سَمِعْنَا}, {فَآمَنَّا}), ـوا they ({هَاجَرُوا}, {وَقَاتَلُوا}), nothing = he ({فَاسْتَجَابَ}).'},
pres:{t:'Present verbs',h:'who does it',d:'A present verb starts with a doer-prefix: يـ he / they ({يَذْكُرُونَ}, {يُنَادِي}), تـ you or she / it ({تُدْخِلِ}, {تُخْلِفُ}, {تَجْرِي}), أ I ({أُضِيعُ}). {تَجْرِي} is “she / it flows” because its doer {الْأَنْهَارُ} is a plural of things.'},
pass:{t:'Passive',h:'done to them',d:'The doer disappears and the vowels become u … i: {وَأُخْرِجُوا}, {وَأُوذُوا}, {وَقُتِلُوا}, {أُنزِلَ}. Compare active {وَقَاتَلُوا} with passive {وَقُتِلُوا}: same letters, different vowels.'},
imp:{t:'Commands',h:'orders and pleas',d:'A command is the bare stem, with no يـ / تـ prefix. In du‘a it takes ـنا (us): {فَقِنَا}, {وَآتِنَا}, {وَتَوَفَّنَا}; or stands alone: {فَاغْفِرْ}, {وَكَفِّرْ}. To a group it ends in ـُوا: {آمِنُوا}, {اصْبِرُوا}, {وَصَابِرُوا}, {وَرَابِطُوا}, {وَاتَّقُوا}.'},
la:{t:'{لَا / مَا}',h:'not · do not',d:'لَا before a present verb has two jobs. A plea or warning: {وَلَا تُخْزِنَا}, {لَا يَغُرَّنَّكَ}. A flat statement: {لَا أُضِيعُ}, {لَا تُخْلِفُ}, {لَا يَشْتَرُونَ}. مَا negates too: {مَا خَلَقْتَ} (past), {وَمَا لِلظَّالِمِينَ} (“there is not for…”).'},
emph:{t:'{لَـ … ـنَّ}',h:'surely',d:'A heavy -nna on a verb makes it emphatic: {لَا يَغُرَّنَّكَ}. With لَـ in front it is a promise: {لَأُكَفِّرَنَّ} and {وَلَأُدْخِلَنَّهُمْ} = “I will surely…”. The frame is لَـ + أُ (I) + stem + ـنَّ, and a glued pronoun comes after the ـنَّ: {وَلَأُدْخِلَنَّهُمْ}.'},
voc:{t:'{رَبَّنَا} · {يَا أَيُّهَا}',h:'calling out',d:'{رَبَّنَا} = {رَبَّ} (Lord) + {نَا} (our), said as a call, with fatha. It opens five requests (191–194), and what follows changes each time: {إِنَّكَ}… / {إِنَّنَا}… / {فَاغْفِرْ}… / {وَآتِنَا}… . {يَا أَيُّهَا} in 200 is another call, now to the believers.'},
inna:{t:'{إِنَّ}',h:'indeed + pronoun',d:'إِنَّ draws attention (“indeed…”) and wants a noun or pronoun right after it, so a pronoun is glued on: {إِنَّكَ}, {إِنَّنَا}, {أَنِّي}, and with لَعَلَّ: {لَعَلَّكُمْ}. If a full noun follows, it takes fatha: {إِنَّ اللَّهَ}. The doubled نّ belongs to إِنَّ; what comes after it is the pronoun.'},
fa:{t:'{فَـ}',h:'so · then',d:'فَـ means what follows is a result or reaction. {فَقِنَا}: because we said this, so protect us. {فَاسْتَجَابَ}: so He answered. {فَالَّذِينَ}: so those who…'},
rel:{t:'{الَّذِينَ}',h:'those who',d:'A clause follows and says who they are; the verb ending points back at the group: {الَّذِينَ يَذْكُرُونَ}, {الَّذِينَ كَفَرُوا}, {الَّذِينَ اتَّقَوْا}, {الَّذِينَ آمَنُوا}.'},
al:{t:'{الـ}',h:'the',d:'الـ makes a noun specific. Before sun letters the ل is silent and the next letter doubles: {النَّارِ}, {الثَّوَابِ}, {لِلظَّالِمِينَ}. Before the others you hear it: {الْأَرْضِ}, {الْأَنْهَارُ}.'},
ptc:{t:'Doer nouns',h:'the one who does it',d:'A doer-noun names the one who does the action: {الظَّالِمِينَ} wrongdoers, {خَالِدِينَ} remaining, {خَاشِعِينَ} humble, {مُنَادِيًا} a caller, {عَامِلٍ} a worker. Plural ـِينَ looks the same after a preposition ({لِلظَّالِمِينَ}) and as a “state” ({خَاشِعِينَ}).'},
ord:{t:'Word order',h:'Arabic vs English order',d:''}};

if(SFX[c]||c==='h'){const key=c==='h'?(w.t.h?'h':'hA'):c;const val=String(w.t[key]),m=val.split('/')[0],fn=val.split('/')[1];return '{'+SFX[key][0]+'} in {'+w.ar+'} = '+m+'. '+(FN[fn]||'')}
switch(c){
case'fi':return w.k==='فيها'?'{'+w.ar+'} = {فِي} + {ـها}. فِي stays; the pronoun glues on after it and points back to the gardens.':'{'+w.ar+'} rules {'+n.ar+'}: its last letter takes kasra (ـِ)'+(n.t.y?', then the glued ـي follows':'')+'.'+(n.k==='خلق'?' On its own the ق could end ـُ or ـَ; after فِي it ends ـِ.':'');
case'li':return(w.t.hm||w.t.nA)?'{'+w.ar+'} = {لِـ} + glued pronoun. Before a pronoun, لِ becomes لَـ.':'{لِـ} is glued to the front of {'+w.ar+'}; the noun after it ends in kasra / ـِينَ.';
case'min':return w.k.length>3?'{'+w.ar+'} = {مِن} + glued {ـكُم}: from you.':'{'+w.ar+'} rules {'+n.ar+'}: kasra or ـٍ.'+(n.k==='انصار'?' Here مِنْ also adds “any”.':'');
case'pr':return w.t.bi?'{بِـ} is glued to the front; the noun after it ends in kasra: {'+w.ar+'}.':sk0(w)?'{'+w.ar+'} = preposition + glued pronoun.':'{'+w.ar+'} rules {'+n.ar+'}: its ending is kasra.';
case'case':return ROLE[v]+'. Here: '+String(w.t[v]).replace(/_/g,' ')+'.';
case'voc':return(w.k==='يا'||w.k==='ايها')?'{يَا أَيُّهَا} is a call. Those called come next, {الَّذِينَ آمَنُوا}, then four commands.':'{'+w.ar+'} is a call. What follows'+(n.ar?' ({'+n.ar+'})':'')+' is what the speaker says to the one called.';
case'inna':return sk0(w)?'{'+w.ar+'} = particle + glued pronoun ('+String(w.t[sk0(w)]).split('/')[0]+').':(n.t.A?'{'+w.ar+'} makes {'+n.ar+'} take fatha (ـَ).':'{'+w.ar+'}: the noun it governs is delayed until after the phrase that follows.');
case'imp':return'Command: no prefix.'+(w.t.wA?' ـُوا = you all.':'')+(w.t.nA?' ـنَا = us, glued on.':'');
case'la':return'{'+w.ar+'}'+(n.ar?' + {'+n.ar+'}':'')+': '+LAL[w.t.la];
case'emph':return w.t.oath?'{'+w.ar+'} = لَـ (surely) + stem + ـنَّ'+(w.t.hm?' + ـهُمْ (them)':'')+': “I will surely …”.':'{'+w.ar+'} ends in ـنَّ before ـكَ: an emphatic “let it not …”.';
case'past':return'Doer inside the verb: '+String(w.t.past).replace('_',' ')+'.';
case'pres':return'Prefix '+({'ي':'يـ','ت':'تـ','ا':'أ'}[core(w)[0]]||'')+' = '+String(w.t.pres).replace('_',' ')+(w.t.pres==='it'?' (feminine: its doer is a plural of things)':'')+'.';
case'pass':return'Passive: u … i vowels, doer left out.';
case'al':return'{الـ} on {'+w.ar+'}: “the”. '+(w.sun?'The ل is silent and the next letter doubles.':'The ل is pronounced.');
case'fa':return'{'+w.ar+'}: links this to what came before as a result or response.';
case'ptc':return'{'+w.ar+'}: the one who does it; the ending shows its role.';
case'rel':return'{'+w.ar+'}: “those who”; the verb after it says who they are.'}
return''}
function cons(w){const o=[],t=w.t;
['nA','y','hm','km','k','wA'].forEach(k=>t[k]&&o.push({c:k}));if(t.h||t.hA)o.push({c:'h'});
if(t.fi)o.push({c:'fi'});if(t.li)o.push({c:'li'});if(t.min)o.push({c:'min'});if(t.pr||t.bi)o.push({c:'pr'});
['N','A','G'].forEach(r=>t[r]&&o.push({c:'case',v:r}));
if(t.voc)o.push({c:'voc'});if(t.inna)o.push({c:'inna'});if('imp' in t)o.push({c:'imp'});if(t.la)o.push({c:'la'});if(t.emph||t.oath)o.push({c:'emph'});
if(t.past)o.push({c:'past'});if(t.pres)o.push({c:'pres'});if(t.pass)o.push({c:'pass'});if(w.al)o.push({c:'al'});if(t.fa)o.push({c:'fa'});if(t.ptc)o.push({c:'ptc'});if(t.rel)o.push({c:'rel'});return o}
const pid=x=>SFX[x.c]||x.c==='h'?'sfx:'+x.c:x.c==='case'?'case:'+x.v:x.c==='emph'?'emph':x.c;
function card(w,x){const C=CONC[x.c];
if(!show(x.c))return'<div class="mini">'+A(C.t)+' · marked understood <button data-act="exp" data-c="'+x.c+'">explain again</button></div>';
return'<div class="cd"><div class="ct">'+A(C.t)+' <span class="mu">'+C.h+'</span></div><div class="oc2">'+A(occ(x,w))+'</div>'+(x.c==='case'?contrast(w):'')+'<div class="gx">'+A(C.d)+'</div><div class="cb"><button data-act="pat" data-v="'+pid(x)+'">Show all in passage</button>'+undBtn(x.c)+'</div></div>'}
function contrast(w){const cr=['N','A','G'].find(r=>w.t[r]);const seen={};const o=ALL.filter(x=>{const r=['N','A','G'].find(q=>x.t[q]);if(!r||r===cr||!w.root||x.root!==w.root||seen[r])return false;seen[r]=1;return true});
return o.length?'<div class="mu">Same word, another role:</div><div class="cb">'+o.map(x=>'<button data-act="word" data-a="'+x.a+'" data-i="'+x.i+'"><span class="ar">'+x.ar+'</span> '+x.a+' · '+String(x.t[['N','A','G'].find(q=>x.t[q])]).replace(/_/g,' ')+'</button>').join('')+'</div>':''}
function wordCard(w){let h='<div class="r"><span class="ar" style="font-size:40px">'+w.ar+'</span></div>'+partsHTML(w);
const same=ALL.filter(x=>x.k===w.k&&!(x.a===w.a&&x.i===w.i)),fam=[],sf={};ALL.forEach(x=>{if(w.root&&x.root===w.root&&x.k!==w.k&&!sf[x.k]){sf[x.k]=1;fam.push(x)}});
if(same.length)h+='<div class="mu">Same word also in</div><div class="cb">'+same.map(x=>'<button data-act="word" data-a="'+x.a+'" data-i="'+x.i+'">'+x.a+'</button>').join('')+'</div>';
if(fam.length)h+='<div class="mu" style="margin-top:6px">Same root, other shapes</div><div class="cb">'+fam.map(x=>'<button data-act="word" data-a="'+x.a+'" data-i="'+x.i+'"><span class="ar">'+x.ar+'</span> '+x.a+'</button>').join('')+'</div>';
h+=cons(w).map(x=>card(w,x)).join('');return h}
function tabSnd(a){const f=fas(a),same=AYS.filter(x=>fas(x)===f&&x!==a);
let h='<div class="r">Ending <span class="ar">'+FS[f][0]+'</span> '+(same.length?'· shared with '+same.map(x=>'<button data-act="ay" data-a="'+x+'">'+x+'</button>').join(' '):'· the only one in this passage')+'</div><div class="r">'+A(SND[a])+'</div>';
const gr={},go={};W[a].forEach(w=>{if(w.k.length<3)return;(gr[rh(w)]=gr[rh(w)]||[]).push(w);(go[on(w)]=go[on(w)]||[]).push(w)});
const cr=Object.keys(gr).filter(k=>gr[k].length>1).sort((x,y)=>gr[y].length-gr[x].length).slice(0,6),co=Object.keys(go).filter(k=>go[k].length>1).sort((x,y)=>go[y].length-go[x].length).slice(0,5);
const ch=(id,l)=>{ensureP(id);return'<button data-act="pat" data-v="'+id+'" class="'+(st.pat===id?'on':'')+'"><span class="ar">'+l+'</span></button>'};
if(cr.length)h+='<div class="cp"><span class="lb">Same ending</span>'+cr.map(k=>ch('er:'+k,'ـ'+k)).join('')+'</div>';
if(co.length)h+='<div class="cp"><span class="lb">Same start</span>'+co.map(k=>ch('eo:'+k,k+'ـ')).join('')+'</div>';
return h+'<div class="mu">Tapping one lights up every word in the passage that shares it.</div>'}
function tabRhy(a){const g={};W[a].forEach(w=>(g[w.ch]=g[w.ch]||[]).push(w));
return'<div class="mu">Each block is a syllable. Wide = long vowel. Pink = doubled letter. Tall = closed syllable. Read right to left; a new row is a natural breath group.</div>'+Object.keys(g).map(k=>{const c=g[k],n=c.reduce((s,w)=>s+syl(w).length,0);
return'<div class="chk"><div class="cl2">'+n+'</div><div class="sr">'+c.map(w=>'<button class="wc'+(isSel(w)?' on':'')+'" data-act="word" data-a="'+a+'" data-i="'+w.i+'"><span class="ar">'+w.ar+'</span><span class="bl">'+syl(w).map(s=>'<i class="b'+(s.l?' L':'')+(s.g?' G':'')+(s.c?' C':'')+'"></i>').join('')+'</span></button>').join('')+'</div></div>'}).join('')}
function tabGr(a){let rows='';W[a].forEach(w=>{const cs=cons(w).filter(x=>show(x.c));if(!cs.length)return;rows+='<div class="gr"><button class="wb" data-act="word" data-a="'+a+'" data-i="'+w.i+'"><span class="ar">'+w.ar+'</span></button><div>'+cs.map(x=>'<div class="gl"><span class="tg">'+A(CONC[x.c].t)+'</span> '+A(occ(x,w))+'</div>').join('')+'</div></div>'});
return rows||'<div class="mu">Everything in this ayah is marked understood. Turn on “show understood too” in the checklist to see it.</div>'}
function tabEnd(a){let h='<div class="mu">Glued endings</div>',any=false;W[a].forEach(w=>{const sk=sk0(w);if(!sk)return;any=true;const v=String(w.t[sk]).split('/'),c=sk==='hA'?'h':sk;
h+='<div class="gr"><button class="wb" data-act="word" data-a="'+a+'" data-i="'+w.i+'"><span class="ar">'+wt(w,true)+'</span></button><div class="gl">'+A('{'+SFX[sk][0]+'} = '+v[0]+(show(c)?'. '+(FN[v[1]]||''):''))+'</div></div>'});
if(!any)h+='<div class="mu">None in this ayah.</div>';
h+='<div class="mu" style="margin-top:8px">Role endings</div>';any=false;
W[a].forEach(w=>{const r=['N','A','G'].find(q=>w.t[q]);if(!r)return;any=true;h+='<div class="gr"><button class="wb" data-act="word" data-a="'+a+'" data-i="'+w.i+'"><span class="ar">'+wt(w,true)+'</span></button><div class="gl">'+A(ROLE[r].split(':')[0]+(show('case')?' · '+String(w.t[r]).replace(/_/g,' '):''))+'</div></div>'});
return h+(any?'':'<div class="mu">None in this ayah.</div>')}
function tabOrd(a){let h='';(AYO[a]||[]).forEach(n=>{const key=JSON.stringify([[a,n[0][0],n[0][1]]]);h+='<div class="gr"><button data-act="rg" data-r=\''+key+'\' class="'+(st.rg&&JSON.stringify(st.rg)===key?'on':'')+'">Show</button><div class="gl">'+A(n[1])+'</div></div>'});
const os=ORD.map((o,i)=>[o,i]).filter(x=>x[0].r.some(r=>r[0]===a));
return h+os.map(x=>ordCard(x[0],x[1])).join('')}
const TABS=[['snd','Sound'],['rhy','Rhythm'],['gr','Grammar'],['end','Endings'],['ord','Word order']];
function ayPanel(a){const w=st.sel&&st.sel.a===a?W[a][st.sel.i]:null;
let h='<div class="pn"><div class="crm"><button data-act="home">Passage</button> › <button data-act="ay" data-a="'+a+'">Ayah '+a+'</button>'+(w?' › <span class="ar">'+w.ar+'</span>':'')+'</div>';
if(w)h+=wordCard(w)+'<hr style="border:0;border-top:0.5px solid var(--bd);margin:10px 0">';
h+='<div class="tabs">'+TABS.map(t=>'<button data-act="tab" data-v="'+t[0]+'" class="'+(st.tab===t[0]?'on':'')+'">'+t[1]+'</button>').join('')+'</div>';
h+={snd:tabSnd,rhy:tabRhy,gr:tabGr,end:tabEnd,ord:tabOrd}[st.tab](a);return h+'</div>'}
function render(){const any=st.sel||st.pat||st.rg;let h=shapeHTML()+lensPanel()+'<div class="'+(st.za?'z ':'')+(any?'dim':'')+'">';
AYS.forEach(a=>{h+=rowHTML(a);if(st.za===a)h+=ayPanel(a)});M.innerHTML=h+'</div>';
document.getElementById('thb').textContent=st.light?'Dark theme':'Light theme';Q.classList.toggle('light',st.light)}
function renderCk(){let h='<div class="mu" style="margin-bottom:4px">Checked = keep explaining. Uncheck what you already understand and its explanation disappears everywhere.</div>';
GROUPS.forEach(g=>{h+='<h4>'+g[0]+'</h4>'+g[1].map(c=>'<label><input type="checkbox" data-c="'+c+'" '+(st.chk[c]!==false?'checked':'')+'> '+A(CONC[c].t)+' <span class="mu">'+CONC[c].h+'</span></label>').join('')});
h+='<label style="margin-top:8px"><input type="checkbox" id="all" '+(st.all?'checked':'')+'> Show understood explanations too</label>';CK.innerHTML=h}
Q.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t)return;const d=t.dataset,a=d.act;
if(a==='lens'){st.lens=d.v;st.pat=null;st.rg=null}
else if(a==='pat'){ensureP(d.v);st.pat=st.pat===d.v?null:d.v;st.rg=null}
else if(a==='word'){const x=+d.a,i=+d.i;st.sel=st.sel&&st.sel.a===x&&st.sel.i===i?null:{a:x,i:i};st.za=x}
else if(a==='ay'){const n=+d.a;if(st.za===n){if(st.sel)st.sel=null;else st.za=null}else{st.za=n;st.sel=null}}
else if(a==='home'){st.za=null;st.sel=null}
else if(a==='tab')st.tab=d.v;
else if(a==='rg'){const r=JSON.parse(d.r);st.rg=st.rg&&JSON.stringify(st.rg)===d.r?null:r;st.pat=null}
else if(a==='und'){st.chk[d.c]=false;save();renderCk()}
else if(a==='exp'){st.chk[d.c]=true;save();renderCk()}
else if(a==='theme')st.light=!st.light;
else if(a==='ckb'){st.ck=!st.ck;CK.hidden=!st.ck;renderCk();return}
render()});
CK.addEventListener('change',e=>{const i=e.target;if(i.id==='all')st.all=i.checked;else{st.chk[i.dataset.c]=i.checked;save()}render()});
render();renderCk();
})();
</script></div></body></html>
