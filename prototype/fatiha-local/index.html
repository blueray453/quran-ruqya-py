<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Al-Fatiha — local word highlight</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            background: #fdf6e3;
            color: #586e75;
            padding: 2em;
            text-align: center;
        }

        .surah {
            font-family: "Amiri Quran", "Scheherazade New", "Noto Naskh Arabic", serif;
            font-size: 2.2em;
            line-height: 2;
            direction: rtl;
        }

        .ayah {
            margin: 1em 0;
        }

        .word {
            display: inline-block;
            padding: 0 .15em;
            border-radius: 6px;
            transition: background-color 80ms;
        }

        .word.active {
            background: rgba(181, 137, 0, .55);
        }

        .word.done {
            background: rgba(42, 161, 152, .15);
        }

        button {
            font-size: 1em;
            padding: .5em 1.2em;
            border: 0;
            background: #2aa198;
            color: #fff;
            border-radius: 6px;
            cursor: pointer;
        }

        #status {
            color: #839496;
            font-size: .9em;
            margin-top: .5em;
        }
    </style>
</head>

<body>
    <div class="surah" id="surah"></div>
    <button id="play">▶ Recite</button>
    <div id="status">—</div>
    <audio id="audio" preload="auto"></audio>
    <script>
        const RECITER = "ar.alafasy";
        const BASE = "./data";
        const SURAH = 1;                       // Al-Fatiha

        const surahEl = document.getElementById("surah");
        const audio = document.getElementById("audio");
        const playBtn = document.getElementById("play");
        const statusEl = document.getElementById("status");

        let segmentsByAyah = {};                 // { ayahNo: [[pos,start,end], ...] }
        let audioUrlsByAyah = {};                // { ayahNo: "./data/audio/.../1_N.mp3" }
        let wordSpans = [];                      // wordSpans[ayahIdx][renderedIdx]
        let currentAyah = 1;
        let maxActiveThisAyah = 0;

        // The ayah-number pseudo-word ("١","٢",…) lives in words.json as the last
        // entry of each ayah, but has no real segment timing. Skip it on render.
        function isAyahMarker(text) {
            return /^[\u0660-\u0669\u06F0-\u06F9\s]+$/.test(text || "");
        }

        async function loadAll() {
            statusEl.textContent = "Loading local data…";
            const [words, rec] = await Promise.all([
                fetch(`${BASE}/script/words.json`).then(r => r.json()),
                fetch(`${BASE}/recitations/${RECITER}.json`).then(r => r.json()),
            ]);

            // Group real word entries by ayah. Keys look like "1:1:3"; the third
            // component is the SAME number segments[i][0] uses, so keep it verbatim.
            const ayahWords = {};
            for (const key of Object.keys(words)) {
                const [s, a, w] = key.split(":").map(Number);
                if (s !== SURAH) continue;
                const text = words[key].text;
                if (isAyahMarker(text)) continue;          // ← FIX #1
                (ayahWords[a] ||= []).push({ pos: w, text });
            }

            for (const a of Object.keys(ayahWords).sort((x, y) => x - y)) {
                ayahWords[a].sort((x, y) => x.pos - y.pos);

                const row = document.createElement("div");
                row.className = "ayah";
                const spans = ayahWords[a].map(({ pos, text }) => {
                    const sp = document.createElement("span");
                    sp.className = "word";
                    sp.textContent = text;
                    sp.dataset.word = pos;                   // ← FIX #2: original word number
                    row.appendChild(sp);
                    return sp;
                });
                surahEl.appendChild(row);
                wordSpans.push(spans);

                segmentsByAyah[a] = (rec[`${SURAH}:${a}`] || {}).segments || [];
                audioUrlsByAyah[a] = `${BASE}/audio/${RECITER}/${SURAH}_${a}.mp3`;
            }
            statusEl.textContent = "Ready.";
        }

        // Which word's [start, end) contains the current playback time?
        function activeWord(segments, ms) {
            for (const [n, s, e] of segments) if (ms >= s && ms < e) return n;
            return -1;
        }

        function playAyah(a) {
            currentAyah = a;
            maxActiveThisAyah = 0;                       // reset sticky "done" per ayah
            audio.src = audioUrlsByAyah[a];
            audio.play();
        }

        audio.addEventListener("timeupdate", () => {
            const segs = segmentsByAyah[currentAyah] || [];
            const active = activeWord(segs, audio.currentTime * 1000);
            if (active > maxActiveThisAyah) maxActiveThisAyah = active;

            wordSpans[currentAyah - 1].forEach(sp => {
                const w = parseInt(sp.dataset.word, 10);   // ← FIX #3: compare by word no.
                sp.classList.toggle("active", w === active);
                sp.classList.toggle("done", w < maxActiveThisAyah && w !== active);
            });
        });

        audio.addEventListener("ended", () => {
            if (currentAyah < wordSpans.length) playAyah(currentAyah + 1);
            else { statusEl.textContent = "Done."; playBtn.disabled = false; }
        });

        playBtn.addEventListener("click", async () => {
            if (!wordSpans.length) await loadAll();
            playBtn.disabled = true;
            statusEl.textContent = "Reciting…";
            playAyah(1);
        });
    </script>
</body>

</html>
